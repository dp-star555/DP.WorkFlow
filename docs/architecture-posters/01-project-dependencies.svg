<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#93c5fd"/></marker>
    <style>
      .title{font:700 42px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#f8fafc}.sub{font:20px 'Microsoft YaHei',sans-serif;fill:#94a3b8}
      .h{font:700 25px 'Microsoft YaHei',sans-serif;fill:#fff}.t{font:18px 'Microsoft YaHei',sans-serif;fill:#e2e8f0}.small{font:16px 'Microsoft YaHei',sans-serif;fill:#cbd5e1}.tag{font:700 15px 'Microsoft YaHei',sans-serif;fill:#08111f}
      .line{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 8;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="70" y="72" class="title">工作流五层工程地图：谁依赖谁、谁负责什么</text>
  <text x="70" y="110" class="sub">读箭头：上层使用下层。主干没有循环依赖；困惑主要来自命名和职责可见性，而不是依赖方向失控。</text>

  <g filter="url(#shadow)">
    <rect x="90" y="850" width="1420" height="175" rx="20" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
    <rect x="115" y="875" width="220" height="38" rx="19" fill="#60a5fa"/><text x="132" y="901" class="tag">01  DP.WorkFlow.Abstractions</text>
    <text x="115" y="947" class="h">插件契约 / 最低层公共语言</text>
    <text x="450" y="902" class="t">节点：IWorkflowNodeModel、WorkflowNodeModel、NodeAttribute、PropertyAttribute</text>
    <text x="450" y="936" class="t">端口与绑定：WorkflowPortDescriptor、WorkflowBindingKey、WorkflowInput&lt;T&gt;</text>
    <text x="450" y="970" class="t">运行扩展点：IWorkflowNodeHandler、IWorkflowNodeExecutionContext、恢复协调接口</text>
    <text x="450" y="1004" class="small">原则：节点插件只想声明“我是什么、我需要什么”时，应尽量只依赖这一层。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="600" width="660" height="190" rx="20" fill="#123047" stroke="#22d3ee" stroke-width="2"/>
    <rect x="115" y="625" width="180" height="38" rx="19" fill="#22d3ee"/><text x="133" y="651" class="tag">02  DP.WorkFlow.Core</text>
    <text x="115" y="698" class="h">工作流定义 / 编译 / 静态分析</text>
    <text x="115" y="733" class="t">模型：Canvas、CanvasNode、Connection、Point</text>
    <text x="115" y="765" class="t">编译：DefinitionCompiler → WorkflowExecutionPlan</text>
    <text x="115" y="797" class="small">验证与绑定分析属于“运行前能确定的事实”。不执行、不存文件、不画 UI。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="600" width="660" height="190" rx="20" fill="#2d1d42" stroke="#c084fc" stroke-width="2"/>
    <rect x="875" y="625" width="265" height="38" rx="19" fill="#c084fc"/><text x="893" y="651" class="tag">03  DP.WorkFlow.Persistence.Json</text>
    <text x="875" y="698" class="h">JSON 适配器 / 迁移 / 未知节点兜底</text>
    <text x="875" y="733" class="t">WorkflowDocumentJsonStore、WorkflowJsonDocument</text>
    <text x="875" y="765" class="t">Converters、LegacyDocument、MigrationReport</text>
    <text x="875" y="797" class="small">只回答“如何保存和恢复 Core 模型”，不负责编辑行为或执行行为。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="340" width="660" height="195" rx="20" fill="#153524" stroke="#4ade80" stroke-width="2"/>
    <rect x="115" y="365" width="205" height="38" rx="19" fill="#4ade80"/><text x="133" y="391" class="tag">04  DP.WorkFlow.Runtime</text>
    <text x="115" y="438" class="h">执行引擎 / 宿主 / 运行状态</text>
    <text x="115" y="473" class="t">Host → Engine → HandlerCatalog → NodeHandler</text>
    <text x="115" y="505" class="t">Context、BindingResolver、RunResult、Snapshot、Trace</text>
    <text x="115" y="537" class="small">输入是已编译 Definition；输出是结果、快照和轨迹。它不认识 WinForms/WPF。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="300" width="660" height="235" rx="20" fill="#402612" stroke="#fb923c" stroke-width="2"/>
    <rect x="875" y="325" width="230" height="38" rx="19" fill="#fb923c"/><text x="893" y="351" class="tag">05  DP.WorkFlow.UI.Shared</text>
    <text x="875" y="400" class="h">无框架的“展示/编辑应用层”</text>
    <text x="875" y="436" class="t">DesignerSession：编辑命令、选择、视口、Undo/Redo</text>
    <text x="875" y="469" class="t">Workspace / Navigator：文档与子画布导航</text>
    <text x="875" y="502" class="t">Inspector / Diagnostics / Monitor：界面模型</text>
    <text x="875" y="535" class="small">名字叫 Shared，但它实际聚合 Core、Runtime、Persistence、节点包和 ScriptEngine。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="155" width="820" height="105" rx="20" fill="#3b1723" stroke="#fb7185" stroke-width="2"/>
    <text x="435" y="200" class="h">DP.WorkFlow.UI.WinForms / DP.WorkFlow.UI.Wpf</text>
    <text x="435" y="235" class="t">平台控件：绘制、鼠标键盘事件、Dialog/Window；业务状态委托给 UI.Shared。</text>
  </g>

  <path d="M420 850 L420 790" class="line"/><path d="M1180 850 L1180 790" class="line"/>
  <path d="M420 600 L420 535" class="line"/><path d="M1180 600 L1180 535" class="line"/>
  <path d="M800 300 L800 260" class="line"/>
  <path d="M745 438 C800 438 800 418 850 418" class="dash"/>
  <text x="70" y="1070" class="small">关键结论：层次本身基本正确；最容易误解的是 Abstractions 中混入实现，以及 UI.Shared 实际承担了“桌面应用层”职责。</text>
</svg>