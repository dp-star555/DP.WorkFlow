<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101e"/><stop offset="1" stop-color="#152033"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#bae6fd"/></marker><style>.title{font:700 42px 'Microsoft YaHei',sans-serif;fill:#fff}.sub{font:19px 'Microsoft YaHei',sans-serif;fill:#94a3b8}.lane{font:700 28px 'Microsoft YaHei',sans-serif;fill:#fff}.h{font:700 19px 'Microsoft YaHei',sans-serif;fill:#fff}.t{font:16px 'Microsoft YaHei',sans-serif;fill:#dbeafe}.note{font:15px 'Microsoft YaHei',sans-serif;fill:#cbd5e1}.arrow{stroke:#bae6fd;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
 <rect width="1600" height="1100" fill="url(#bg)"/><text x="65" y="68" class="title">三条端到端链路：编辑、保存、运行时到底经过哪些项目</text><text x="65" y="106" class="sub">当你找代码时，不要从项目名猜；先确认自己处于哪条链路、哪一个阶段。</text>

 <rect x="45" y="145" width="1510" height="250" rx="20" fill="#0f2940" stroke="#38bdf8" stroke-width="2"/><text x="75" y="190" class="lane">A. 设计编辑链路</text>
 <g><rect x="75" y="225" width="235" height="105" rx="14" fill="#3b1723"/><text x="95" y="258" class="h">WinForms / WPF Control</text><text x="95" y="286" class="t">鼠标、键盘、绘制</text><text x="95" y="312" class="note">只翻译平台事件</text></g>
 <g><rect x="370" y="225" width="235" height="105" rx="14" fill="#78350f"/><text x="390" y="258" class="h">DesignerSession</text><text x="390" y="286" class="t">Add / Move / Connect</text><text x="390" y="312" class="note">选择、视口、Undo/Redo</text></g>
 <g><rect x="665" y="225" width="235" height="105" rx="14" fill="#164e63"/><text x="685" y="258" class="h">CanvasModel</text><text x="685" y="286" class="t">Nodes + Connections</text><text x="685" y="312" class="note">持久的流程图状态</text></g>
 <g><rect x="960" y="225" width="235" height="105" rx="14" fill="#164e63"/><text x="980" y="258" class="h">DefinitionCompiler</text><text x="980" y="286" class="t">端口/图/绑定验证</text><text x="980" y="312" class="note">Canvas → Definition</text></g>
 <g><rect x="1255" y="225" width="235" height="105" rx="14" fill="#14532d"/><text x="1275" y="258" class="h">DiagnosticsModel</text><text x="1275" y="286" class="t">整理 ValidationError</text><text x="1275" y="312" class="note">反馈到诊断面板</text></g>
 <path d="M310 277H370M605 277H665M900 277H960M1195 277H1255" class="arrow"/><text x="75" y="365" class="note">查“拖动节点为什么不生效”：Control → DesignerSession.MoveNodes → Canvas；查“为什么不能运行”：DefinitionCompiler / Diagnostics。</text>

 <rect x="45" y="425" width="1510" height="250" rx="20" fill="#2a1b3d" stroke="#c084fc" stroke-width="2"/><text x="75" y="470" class="lane">B. 保存与加载链路</text>
 <g><rect x="75" y="505" width="250" height="105" rx="14" fill="#78350f"/><text x="95" y="538" class="h">DocumentWorkspace</text><text x="95" y="566" class="t">Save / Open / Dirty</text><text x="95" y="592" class="note">UI 用例入口</text></g>
 <g><rect x="390" y="505" width="250" height="105" rx="14" fill="#581c87"/><text x="410" y="538" class="h">CanvasJsonStore</text><text x="410" y="566" class="t">序列化与反序列化</text><text x="410" y="592" class="note">Persistence 主门面</text></g>
 <g><rect x="705" y="505" width="250" height="105" rx="14" fill="#581c87"/><text x="725" y="538" class="h">JSON Document / Converter</text><text x="725" y="566" class="t">DTO、节点多态、BindingKey</text><text x="725" y="592" class="note">文件格式细节</text></g>
 <g><rect x="1020" y="505" width="250" height="105" rx="14" fill="#581c87"/><text x="1040" y="538" class="h">Migration / UnknownNode</text><text x="1040" y="566" class="t">旧格式与插件缺失兼容</text><text x="1040" y="592" class="note">尽量不丢原数据</text></g>
 <g><rect x="1335" y="505" width="155" height="105" rx="14" fill="#164e63"/><text x="1355" y="538" class="h">Canvas</text><text x="1355" y="566" class="t">恢复模型</text><text x="1355" y="592" class="note">回到 Core</text></g>
 <path d="M325 557H390M640 557H705M955 557H1020M1270 557H1335" class="arrow"/><text x="75" y="645" class="note">查“字段为什么没保存”：JsonStore / Converter；查“打开旧文件为什么变了”：MigrationReport；Dirty 与 RecentFiles 在 Workspace。</text>

 <rect x="45" y="705" width="1510" height="315" rx="20" fill="#123222" stroke="#4ade80" stroke-width="2"/><text x="75" y="750" class="lane">C. 运行与监视链路</text>
 <g><rect x="75" y="790" width="205" height="110" rx="14" fill="#78350f"/><text x="95" y="823" class="h">StudioRuntimeBinding</text><text x="95" y="852" class="t">Run/Pause/Resume</text><text x="95" y="880" class="note">UI 桥接</text></g>
 <g><rect x="330" y="790" width="205" height="110" rx="14" fill="#14532d"/><text x="350" y="823" class="h">RuntimeHost</text><text x="350" y="852" class="t">运行生命周期</text><text x="350" y="880" class="note">对宿主的统一门面</text></g>
 <g><rect x="585" y="790" width="205" height="110" rx="14" fill="#14532d"/><text x="605" y="823" class="h">WorkflowEngine</text><text x="605" y="852" class="t">令牌调度、并行</text><text x="605" y="880" class="note">消费 Definition</text></g>
 <g><rect x="840" y="790" width="205" height="110" rx="14" fill="#14532d"/><text x="860" y="823" class="h">NodeHandler</text><text x="860" y="852" class="t">执行具体节点</text><text x="860" y="880" class="note">通过 Context 读写数据</text></g>
 <g><rect x="1095" y="790" width="205" height="110" rx="14" fill="#14532d"/><text x="1115" y="823" class="h">Snapshot / Trace</text><text x="1115" y="852" class="t">状态、令牌、轨迹</text><text x="1115" y="880" class="note">只读观察数据</text></g>
 <g><rect x="1350" y="790" width="140" height="110" rx="14" fill="#78350f"/><text x="1370" y="823" class="h">Monitor</text><text x="1370" y="852" class="t">UI 列表</text><text x="1370" y="880" class="note">刷新显示</text></g>
 <path d="M280 845H330M535 845H585M790 845H840M1045 845H1095M1300 845H1350" class="arrow"/>
 <path d="M1195 915 C1195 970 430 970 430 905" class="arrow"/><text x="600" y="995" class="note">Host 持续发布快照；Binding 将最新快照映射到 Navigator、DesignerSession 和 RuntimeMonitor。</text>
 <text x="65" y="1065" class="sub">定位口诀：交互找 UI；状态修改找 Session；图语义找 Core；文件格式找 Persistence；调度与快照找 Runtime。</text>
</svg>