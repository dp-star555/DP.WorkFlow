<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#171126"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="8" flood-opacity=".3"/></filter><style>.title{font:700 42px 'Microsoft YaHei',sans-serif;fill:#f8fafc}.sub{font:19px 'Microsoft YaHei',sans-serif;fill:#94a3b8}.h{font:700 24px 'Microsoft YaHei',sans-serif;fill:#fff}.sh{font:700 18px 'Microsoft YaHei',sans-serif;fill:#fde68a}.t{font:17px 'Microsoft YaHei',sans-serif;fill:#e2e8f0}.sm{font:15px 'Microsoft YaHei',sans-serif;fill:#cbd5e1}</style></defs>
 <rect width="1600" height="1100" fill="url(#bg)"/><text x="65" y="70" class="title">类名速查海报：看到一个类型，先判断它属于哪个阶段</text><text x="65" y="108" class="sub">同名 Binding 分散在三个项目，是因为它分别代表“契约、静态分析、运行时求值”。按生命周期理解比按文件名理解更容易。</text>

 <g filter="url(#s)"><rect x="55" y="150" width="470" height="415" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="82" y="190" class="h">Abstractions · 对外契约</text>
 <text x="82" y="230" class="sh">Nodes</text><text x="82" y="260" class="t">IWorkflowNodeModel / WorkflowNodeModel</text><text x="82" y="288" class="t">WorkflowNodeAttribute / PropertyAttribute</text><text x="82" y="316" class="t">WorkflowPortDescriptor / DynamicPortProvider</text>
 <text x="82" y="356" class="sh">Binding</text><text x="82" y="386" class="t">WorkflowBindingKey：绑定地址</text><text x="82" y="414" class="t">WorkflowInput&lt;T&gt;：常量或绑定包装</text><text x="82" y="442" class="t">GlobalDataCatalog：宿主全局数据声明</text>
 <text x="82" y="482" class="sh">Runtime contracts</text><text x="82" y="512" class="t">IWorkflowNodeHandler / ExecutionContext</text><text x="82" y="540" class="sm">注意：NodeCatalog 是注册表实现；JSON Converter 也是实现泄漏。</text></g>

 <g filter="url(#s)"><rect x="565" y="150" width="470" height="415" rx="18" fill="#123047" stroke="#22d3ee" stroke-width="2"/><text x="592" y="190" class="h">Core · 可编辑、可编译的定义</text>
 <text x="592" y="230" class="sh">Models</text><text x="592" y="260" class="t">WorkflowCanvasModel：整张流程图</text><text x="592" y="288" class="t">WorkflowCanvasNode：节点 + 坐标/尺寸</text><text x="592" y="316" class="t">WorkflowConnectionModel：端口连接与拐点</text>
 <text x="592" y="356" class="sh">Compilation</text><text x="592" y="386" class="t">DefinitionCompiler：Canvas → Definition</text><text x="592" y="414" class="t">WorkflowExecutionPlan：运行前冻结语义</text>
 <text x="592" y="454" class="sh">Analysis / Validation</text><text x="592" y="484" class="t">BindingAnalyzer / GraphValidator</text><text x="592" y="512" class="t">ValidationError / DefinitionException</text><text x="592" y="540" class="sm">Core 不负责文件 IO，也不调度节点执行。</text></g>

 <g filter="url(#s)"><rect x="1075" y="150" width="470" height="415" rx="18" fill="#153524" stroke="#4ade80" stroke-width="2"/><text x="1102" y="190" class="h">Runtime · 真正执行</text>
 <text x="1102" y="230" class="sh">Hosting / Engine</text><text x="1102" y="260" class="t">RuntimeHost：运行生命周期门面</text><text x="1102" y="288" class="t">WorkflowEngine：令牌推进与调度</text><text x="1102" y="316" class="t">ExecutionOptions / RunResult</text>
 <text x="1102" y="356" class="sh">Execution services</text><text x="1102" y="386" class="t">NodeHandlerCatalog / ServiceProvider</text><text x="1102" y="414" class="t">WorkflowContext / BindingResolver</text>
 <text x="1102" y="454" class="sh">Observation</text><text x="1102" y="484" class="t">RuntimeSnapshot / NodeRuntimeInfo</text><text x="1102" y="512" class="t">TraceEntry / TraceBatch / TokenInfo</text><text x="1102" y="540" class="sm">Runtime 消费 Definition，不修改画布布局。</text></g>

 <g filter="url(#s)"><rect x="55" y="610" width="610" height="390" rx="18" fill="#2d1d42" stroke="#c084fc" stroke-width="2"/><text x="82" y="650" class="h">Persistence.Json · Canvas 的文件适配器</text>
 <text x="82" y="694" class="sh">保存 / 加载</text><text x="82" y="724" class="t">WorkflowDocumentJsonStore：主要入口</text><text x="82" y="754" class="t">WorkflowJsonDocument：JSON 文档 DTO</text>
 <text x="82" y="798" class="sh">兼容</text><text x="82" y="828" class="t">LegacyWorkflowDocument：旧格式读取模型</text><text x="82" y="858" class="t">WorkflowMigrationReport：迁移过程报告</text><text x="82" y="888" class="t">UnknownWorkflowNodeModel：插件缺失时保留原数据</text>
 <text x="82" y="938" class="sh">转换器</text><text x="82" y="968" class="t">BindingKeyJsonConverter 等 JSON 细节</text></g>

 <g filter="url(#s)"><rect x="705" y="610" width="840" height="390" rx="18" fill="#402612" stroke="#fb923c" stroke-width="2"/><text x="732" y="650" class="h">UI.Shared · 桌面应用层模型（并不是通用领域 Core）</text>
 <text x="732" y="694" class="sh">Designer</text><text x="732" y="724" class="t">DesignerSession：编辑命令、选择、视口、撤销重做</text><text x="732" y="754" class="t">Geometry / OrthogonalRouter：两套桌面 UI 共用算法</text>
 <text x="732" y="798" class="sh">Document &amp; Navigation</text><text x="732" y="828" class="t">DocumentWorkspace：新建/打开/保存/Dirty/Recent</text><text x="732" y="858" class="t">DesignerNavigator：根画布 ↔ 复合节点子画布</text>
 <text x="1150" y="694" class="sh">Presentation models</text><text x="1150" y="724" class="t">PropertyInspector / NodeEditor</text><text x="1150" y="754" class="t">BindingTree / MappingEditor</text><text x="1150" y="784" class="t">Diagnostics / RuntimeMonitor</text>
 <text x="1150" y="828" class="sh">Glue</text><text x="1150" y="858" class="t">StudioRuntimeBinding：UI 与 Host 桥接</text><text x="1150" y="888" class="t">CSharpScriptEditorModel：ScriptEngine 桥接</text><text x="1150" y="938" class="sm">它被 WinForms 与 WPF 共用，所以“Shared”指 UI 平台共享。</text></g>
 <text x="65" y="1060" class="sub">记忆法：契约声明 → Core 编译 → Runtime 执行；Persistence 把 Core 落盘；UI.Shared 把这些能力组织成桌面用户操作。</text>
</svg>