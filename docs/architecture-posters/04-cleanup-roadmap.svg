<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#22152a"/></linearGradient><style>.title{font:700 42px 'Microsoft YaHei',sans-serif;fill:#fff}.sub{font:19px 'Microsoft YaHei',sans-serif;fill:#94a3b8}.h{font:700 24px 'Microsoft YaHei',sans-serif;fill:#fff}.t{font:17px 'Microsoft YaHei',sans-serif;fill:#e2e8f0}.sm{font:15px 'Microsoft YaHei',sans-serif;fill:#cbd5e1}.num{font:700 34px 'Microsoft YaHei',sans-serif;fill:#08111f}</style></defs>
 <rect width="1600" height="1100" fill="url(#bg)"/><text x="65" y="70" class="title">为什么觉得乱，以及怎样在不破坏工程的前提下整理</text><text x="65" y="108" class="sub">建议先提高“可发现性”，再移动代码。直接合并项目会削弱插件边界，并不一定让系统更简单。</text>

 <rect x="55" y="150" width="720" height="350" rx="20" fill="#3b1723" stroke="#fb7185" stroke-width="2"/><text x="85" y="193" class="h">当前最主要的 4 个认知障碍</text>
 <circle cx="105" cy="242" r="23" fill="#fb7185"/><text x="95" y="253" class="num">1</text><text x="145" y="236" class="t">三个程序集都使用 namespace Workflow</text><text x="145" y="264" class="sm">IDE 中只看 using，很难知道类型来自 Abstractions、Core 还是 Runtime。</text>
 <circle cx="105" cy="316" r="23" fill="#fb7185"/><text x="95" y="327" class="num">2</text><text x="145" y="310" class="t">Binding 横跨三层，但文件名没有表达阶段</text><text x="145" y="338" class="sm">BindingKey 是契约，BindingAnalysis 是编译期，BindingResolver 是运行期。</text>
 <circle cx="105" cy="390" r="23" fill="#fb7185"/><text x="95" y="401" class="num">3</text><text x="145" y="384" class="t">UI.Shared 是依赖汇聚点，名字却像轻量工具库</text><text x="145" y="412" class="sm">它实际上是桌面应用层：文档用例、编辑命令、属性模型、运行桥接都在这里。</text>
 <circle cx="105" cy="464" r="23" fill="#fb7185"/><text x="95" y="475" class="num">4</text><text x="145" y="458" class="t">Abstractions 中混入少量具体实现</text><text x="145" y="486" class="sm">WorkflowNodeCatalog 和 System.Text.Json Converter 让“纯契约”边界不够直观。</text>

 <rect x="825" y="150" width="720" height="350" rx="20" fill="#102f2b" stroke="#34d399" stroke-width="2"/><text x="855" y="193" class="h">新代码放哪里？使用这张判断表</text>
 <text x="855" y="238" class="t">① 其他节点插件必须引用它才能编译？</text><text x="1280" y="238" class="sm">→ Abstractions</text>
 <text x="855" y="282" class="t">② 描述流程图、编译、验证，且不执行？</text><text x="1280" y="282" class="sm">→ Core</text>
 <text x="855" y="326" class="t">③ 调度节点、处理 Context、快照或轨迹？</text><text x="1280" y="326" class="sm">→ Runtime</text>
 <text x="855" y="370" class="t">④ 只与 JSON 文件格式、Converter、迁移有关？</text><text x="1280" y="370" class="sm">→ Persistence.Json</text>
 <text x="855" y="414" class="t">⑤ WinForms/WPF 共用的编辑或展示状态？</text><text x="1280" y="414" class="sm">→ UI.Shared</text>
 <text x="855" y="458" class="t">⑥ 使用 Control、Window、Brush、Graphics？</text><text x="1280" y="458" class="sm">→ 对应平台 UI</text>

 <text x="65" y="560" class="h">推荐整理路线：按风险从低到高分四步</text>
 <g><rect x="55" y="600" width="350" height="365" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/><circle cx="105" cy="650" r="28" fill="#60a5fa"/><text x="95" y="662" class="num">1</text><text x="150" y="658" class="h">先补地图，不搬代码</text><text x="82" y="708" class="t">• 保留这些海报和索引</text><text x="82" y="742" class="t">• 每个项目增加 README</text><text x="82" y="776" class="t">• 写明“属于 / 不属于”</text><text x="82" y="820" class="sm">风险最低，立刻改善新人和 IDE 导航体验。</text><text x="82" y="880" class="sm">建议提交：docs only</text></g>
 <g><rect x="435" y="600" width="350" height="365" rx="18" fill="#123047" stroke="#22d3ee" stroke-width="2"/><circle cx="485" cy="650" r="28" fill="#22d3ee"/><text x="475" y="662" class="num">2</text><text x="530" y="658" class="h">统一目录词汇</text><text x="462" y="708" class="t">• Core/Definition、Analysis</text><text x="462" y="742" class="t">• Runtime/Execution、Monitoring</text><text x="462" y="776" class="t">• UI.Shared/Editing、Presentation</text><text x="462" y="820" class="sm">只移动同项目文件，namespace 暂时不变，调用方几乎无影响。</text><text x="462" y="880" class="sm">建议提交：folder-only move</text></g>
 <g><rect x="815" y="600" width="350" height="365" rx="18" fill="#302047" stroke="#c084fc" stroke-width="2"/><circle cx="865" cy="650" r="28" fill="#c084fc"/><text x="855" y="662" class="num">3</text><text x="910" y="658" class="h">修正边界泄漏</text><text x="842" y="708" class="t">• JSON Converter 移到 Persistence</text><text x="842" y="742" class="t">• 评估 NodeCatalog 移到 Core</text><text x="842" y="776" class="t">• UI.Shared 改名 Desktop.Shared</text><text x="842" y="820" class="sm">需要兼容序列化属性和所有项目引用，必须配套测试。</text><text x="842" y="880" class="sm">建议提交：one concern each</text></g>
 <g><rect x="1195" y="600" width="350" height="365" rx="18" fill="#3d2b13" stroke="#fbbf24" stroke-width="2"/><circle cx="1245" cy="650" r="28" fill="#fbbf24"/><text x="1235" y="662" class="num">4</text><text x="1290" y="658" class="h">最后调整 namespace</text><text x="1222" y="708" class="t">• DP.WorkFlow.Abstractions.*</text><text x="1222" y="742" class="t">• DP.WorkFlow.Core.*</text><text x="1222" y="776" class="t">• DP.WorkFlow.Runtime.*</text><text x="1222" y="820" class="sm">可发现性最好，但会修改大量 using 和公开 API；适合主版本升级。</text><text x="1222" y="880" class="sm">建议提交：breaking change</text></g>
 <text x="65" y="1020" class="h">不建议：为了“文件少”把五个项目直接合并。</text><text x="65" y="1055" class="sub">项目数减少不等于复杂度消失；依赖约束、插件最小引用和无 UI 运行能力反而会一起丢失。</text>
</svg>